name: Build Narendra Billing APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build Debug APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK Licenses & Preload Platform
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" "platforms;android-36.1" || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Debug Keystore Exists
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64"
          elif [ ! -f debug.keystore ] && [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore
            echo "Restored debug.keystore from DEBUG_KEYSTORE_BASE64 secret"
          elif [ ! -f debug.keystore ]; then
            echo "::warning::debug.keystore.base64 not found! Generating temporary keystore — Google Sign-In will NOT work unless this SHA-1 is registered in Firebase."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:"

      - name: Restore Google Services Config (if secret configured)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            TRIMMED="$(printf '%s' "$GOOGLE_SERVICES_JSON" | sed -e 's/^[[:space:]]*//')"
            if printf '%s' "$TRIMMED" | grep -q '^{'; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | base64 -d > app/google-services.json
            fi
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json is missing. Add GOOGLE_SERVICES_JSON secret in GitHub Settings -> Secrets -> Actions so Google Sign-In works in the CI-built APK."
          else
            APK_SHA1="$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | sed -n 's/.*SHA1:[[:space:]]*//p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            if ! grep -qi "$APK_SHA1" app/google-services.json; then
              echo "::warning::APK SHA-1 ($APK_SHA1) does NOT match certificate_hash in app/google-services.json! Re-copy app/google-services.json from AI Studio into GOOGLE_SERVICES_JSON secret."
            else
              echo "Verified: debug.keystore SHA-1 matches app/google-services.json"
            fi
          fi

      - name: Run Unit & Robolectric Tests
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g"
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g"
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NarendraBilling-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
