name: Build Narendra Billing APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build Debug APK & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK Licenses & Preload Platform
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" "platforms;android-36.1" || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore & Lock Original Signing Keystore (Required for In-Place Updates)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 || vars.DEBUG_KEYSTORE_BASE64 }}
        run: |
          EXPECTED_SHA1="84475d3d607acd7a6149834c02afe23a6b015410"
          CLEAN_KEYSTORE_B64="$(printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]')"
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Restored debug.keystore from committed debug.keystore.base64"
          elif [ ! -f debug.keystore ] && [ -n "$CLEAN_KEYSTORE_B64" ]; then
            printf '%s' "$CLEAN_KEYSTORE_B64" | base64 -d > debug.keystore
            echo "Restored debug.keystore from DEBUG_KEYSTORE_BASE64 secret"
          fi

          if [ ! -f debug.keystore ]; then
            echo "::error::Original debug.keystore / debug.keystore.base64 is missing! Add GitHub Secret DEBUG_KEYSTORE_BASE64 (Settings -> Secrets and variables -> Actions -> New repository secret) with the base64 of your original debug.keystore (SHA-1: $EXPECTED_SHA1). Refusing to generate a new keystore because a different key cannot update the existing installed APK."
            exit 1
          fi

          ACTUAL_SHA1="$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | sed -n 's/.*SHA1:[[:space:]]*//p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "Signing Certificate SHA-1: $ACTUAL_SHA1"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Signing key mismatch! Expected SHA-1 $EXPECTED_SHA1, got $ACTUAL_SHA1. Aborting so incompatible APK is not published."
            exit 1
          fi

      - name: Compute Automatic Monotonic Version Code
        id: version
        run: |
          BASE_CODE="$(grep -E '^VERSION_CODE=' version.properties | cut -d'=' -f2 | tr -d '[:space:]' || echo 2)"
          BASE_NAME="$(grep -E '^VERSION_NAME=' version.properties | cut -d'=' -f2 | tr -d '[:space:]' || echo 1.1)"
          BASE_CODE="${BASE_CODE:-2}"
          BASE_NAME="${BASE_NAME:-1.1}"
          AUTO_VERSION_CODE=$((BASE_CODE + GITHUB_RUN_NUMBER))
          AUTO_VERSION_NAME="${BASE_NAME}.${GITHUB_RUN_NUMBER}"
          echo "APP_VERSION_CODE=$AUTO_VERSION_CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$AUTO_VERSION_NAME" >> "$GITHUB_ENV"
          echo "Resolved Update Version: $AUTO_VERSION_NAME (versionCode=$AUTO_VERSION_CODE)"

      - name: Restore & Verify Google Services Config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON || vars.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            TRIMMED="$(printf '%s' "$GOOGLE_SERVICES_JSON" | sed -e 's/^[[:space:]]*//')"
            if printf '%s' "$TRIMMED" | grep -q '^{'; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | base64 -d > app/google-services.json
            fi
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json is missing. Add GOOGLE_SERVICES_JSON secret in GitHub Settings -> Secrets -> Actions so Google Sign-In works in the CI-built APK."
          else
            APK_SHA1="$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | sed -n 's/.*SHA1:[[:space:]]*//p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            if ! grep -qi "$APK_SHA1" app/google-services.json; then
              echo "::warning::APK SHA-1 ($APK_SHA1) does NOT match certificate_hash in app/google-services.json!"
            else
              echo "Verified: debug.keystore SHA-1 matches app/google-services.json"
            fi
          fi

      - name: Run Unit & Robolectric Tests
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g"
        run: gradle testDebugUnitTest --no-daemon --stacktrace -PAPP_VERSION_CODE="$APP_VERSION_CODE" -PAPP_VERSION_NAME="$APP_VERSION_NAME"

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g"
        run: gradle assembleDebug --no-daemon --stacktrace -PAPP_VERSION_CODE="$APP_VERSION_CODE" -PAPP_VERSION_NAME="$APP_VERSION_NAME"

      - name: Verify Built APK Identity, Version & Signature
        run: |
          APK_FILE="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          echo "Built APK: $APK_FILE"
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK_DIR/build-tools" -name apksigner 2>/dev/null | head -n 1)"
          AAPT2="$(find "$SDK_DIR/build-tools" -name aapt2 2>/dev/null | head -n 1)"
          if [ -n "$APKSIGNER" ]; then
            CERT_OUT="$("$APKSIGNER" verify --print-certs "$APK_FILE")"
            echo "$CERT_OUT"
            echo "$CERT_OUT" | grep -qi "84475d3d607acd7a6149834c02afe23a6b015410"
          fi
          if [ -n "$AAPT2" ]; then
            BADGING="$("$AAPT2" dump badging "$APK_FILE" | head -n 1)"
            echo "$BADGING"
            echo "$BADGING" | grep -q "name='com.aistudio.narendrabilling.kqvxpm'"
            echo "$BADGING" | grep -q "versionCode='$APP_VERSION_CODE'"
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NarendraBilling-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
